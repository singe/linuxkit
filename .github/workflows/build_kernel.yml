name: LinuxKit Kernel Builder
on:
  push:
    paths:
      - 'kernel/**'
      - '.github/workflows/build_kernel.yml'

env:
  KERNEL_SERIES: 5.15.x
  EXTRA: -wifi
  DOCKER_OWNER: singelet
  DOCKER_REPO: linuxkit-kernel-wifi

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:

    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Add wifi kernel config
      working-directory: ./kernel
      run: |
        cat config-$KERNEL_SERIES-x86_64 config$EXTRA > config-$KERNEL_SERIES-x86_64$EXTRA
        cat config-$KERNEL_SERIES-aarch64 config$EXTRA > config-$KERNEL_SERIES-aarch64$EXTRA

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build image
      working-directory: ./kernel
      run: |
        make PLATFORM=${{ matrix.platform }} EXTRA="$EXTRA" ORG="$DOCKER_OWNER" IMAGE="$DOCKER_REPO" buildx_$KERNEL_SERIES$EXTRA

    - name: Push arch specific image
      working-directory: ./kernel
      run: |
        BUILDIMAGE=$(docker images --filter=reference="$DOCKER_OWNER/$DOCKER_REPO:*" --format {{.Repository}}:{{.Tag}})
        echo $BUILDIMAGE
        if [[ "${{ matrix.platform }}" == "linux/amd64" ]]; then ARCH="amd64"; else ARCH="arm64"; fi
        docker push $BUILDIMAGE-$ARCH

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:

    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push multi-arch manifest
      working-directory: ./kernel
      run: |
        TAG=$(git ls-tree --full-tree HEAD -- kernel | awk '{print $3}')
        FULL_REPO="docker.io/$DOCKER_OWNER/$DOCKER_REPO"
        docker buildx imagetools create -t $FULL_REPO:$KERNEL_SERIES$EXTRA-$TAG $FULL_REPO:$KERNEL_SERIES$EXTRA-$TAG-amd64 $FULL_REPO:$KERNEL_SERIES$EXTRA-$TAG-arm64
        docker buildx imagetools create -t $FULL_REPO:$KERNEL_SERIES$EXTRA $FULL_REPO:$KERNEL_SERIES$EXTRA-$TAG
        docker buildx imagetools create -t $FULL_REPO:latest $FULL_REPO:$KERNEL_SERIES$EXTRA-$TAG
