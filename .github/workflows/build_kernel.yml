name: LinuxKit Kernel Builder
on:
  push:
    paths:
      - 'kernel/**'
      - '.github/workflows/build_kernel.yml'

env:
  KERNEL_SERIES: 5.15.x
  EXTRA: -wifi
  DOCKER_REPO: docker.io/singelet/linuxkit-kernel-wifi

jobs:
  build:
    name: Build & Test
    strategy:
      matrix:
        target:
          - os: linux
            arch: amd64
            suffix: amd64-linux
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            suffix: arm64-linux
            runner: ubuntu-latest

    runs-on: ${{ matrix.target.runner }}
    steps:

    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Add wifi kernel config amd64
      working-directory: ./kernel
      run: |
        cat config-$KERNEL_SERIES-x86_64 config$EXTRA > config-$KERNEL_SERIES-x86_64$EXTRA
      if: matrix.target.arch == 'amd64'

    - name: Add wifi kernel config
      working-directory: ./kernel
      run: |
        cat config-$KERNEL_SERIES-aarch64 config$EXTRA > config-$KERNEL_SERIES-aarch64$EXTRA
      if: matrix.target.arch == 'arm64'

    - name: Build amd64
      working-directory: ./kernel
      run: |
        make EXTRA="$EXTRA" build_$KERNEL_SERIES$EXTRA
      if: matrix.target.arch == 'amd64'

    - name: Build aarch64
      working-directory: ./kernel
      run: |
        export ARCH="aarch64"
        make EXTRA="$EXTRA" build_$KERNEL_SERIES-aarch64$EXTRA
      if: matrix.target.arch == 'arm64'

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Tag and push the image
      working-directory: ./kernel
      run: |
        buildimage=$(docker images --filter=reference='linuxkit\/kernel:*' --format {{.Repository}}:{{.Tag}})
        newimage="$DOCKER_REPO:$KERNEL_SERIES$EXTRA"
        echo Tagging $buildimage as $newimage
        docker tag $buildimage $newimage
        docker push $newimage
        KERNEL_VERSION=$(echo $buildimage | grep -o $(echo $KERNEL_SERIES|sed "s/x/[0-9]*/"))
        newimage="$DOCKER_REPO:$KERNEL_VERSION$EXTRA"
        echo Tagging $buildimage as $newimage
        docker tag $buildimage $newimage
        docker push $newimage
        newimage="$DOCKER_REPO:latest"
        echo Tagging $buildimage as $newimage
        docker tag $buildimage $newimage
        docker push $newimage

