name: LinuxKit Kernel Builder
on:
  push:
    paths:
      - 'kernel/**'
      - '.github/workflows/build_kernel.yml'

env:
  KERNEL_SERIES: 5.15.x
  EXTRA: -wifi
  DOCKER_OWNER: singelet
  DOCKER_REPO: linuxkit-kernel-wifi

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          #- linux/arm64

    steps:

    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Add wifi kernel config
      working-directory: ./kernel
      run: |
        ARCH=$(cut -d\/ -f2 <<< "${{ matrix.platform }}")
        if [[ "${{ matrix.platform }}" == "linux/amd64" ]]; then cp config$EXTRA config-$KERNEL_SERIES-x86_64$EXTRA-amd64; else cp config$EXTRA config-$KERNEL_SERIES-aarch64$EXTRA-arm64; fi

    - name: Build image
      working-directory: ./kernel
      run: |
        echo Building for ${{ matrix.platform }}
        ARCH=$(cut -d\/ -f2 <<< "${{ matrix.platform }}")
        make PLATFORMS=${{ matrix.platform }} EXTRA="$EXTRA-$ARCH" ORG="$DOCKER_OWNER" IMAGE="$DOCKER_REPO" buildx_$KERNEL_SERIES$EXTRA-$ARCH

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:

    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push multi-arch manifest
      working-directory: ./kernel
      run: |
        TAG=$(git ls-tree --full-tree HEAD -- kernel | awk '{print $3}')
        KERNEL_VERSION=$(grep "^\$(eval" Makefile | grep "$KERNEL_SERIES,,-dbg"|cut -d, -f2)
        FULL_REPO="docker.io/$DOCKER_OWNER/$DOCKER_REPO"
        docker buildx imagetools create -t $FULL_REPO:$KERNEL_VERSION$EXTRA-$TAG $FULL_REPO:$KERNEL_VERSION$EXTRA-amd64-$TAG $FULL_REPO:$KERNEL_VERSION$EXTRA-arm64-$TAG
        docker buildx imagetools create -t $FULL_REPO:$KERNEL_VERSION$EXTRA $FULL_REPO:$KERNEL_VERSION$EXTRA-$TAG
        docker buildx imagetools create -t $FULL_REPO:latest $FULL_REPO:$KERNEL_VERSION$EXTRA-$TAG
