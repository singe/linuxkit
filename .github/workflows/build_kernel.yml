name: LinuxKit Kernel Builder
on:
  push:
    paths:
      - 'kernel/**'
      - '.github/workflows/build_kernel.yml'

env:
  KERNEL_SERIES: 5.15.x
  EXTRA: -wifi
  DOCKER_REPO: docker.io/singelet/linuxkit-kernel-wifi

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:

    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Add wifi kernel config
      working-directory: ./kernel
      run: |
        cat config-$KERNEL_SERIES-x86_64 config$EXTRA > config-$KERNEL_SERIES-x86_64$EXTRA
        cat config-$KERNEL_SERIES-aarch64 config$EXTRA > config-$KERNEL_SERIES-aarch64$EXTRA

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Install manifest-tool
      uses: pixelfederation/gh-action-manifest-tool@v0.1.0

    - name: Build
      working-directory: ./kernel
      run: |
        make PLATFORM=${{ matrix.platform }} EXTRA="$EXTRA" ORG="singelet" IMAGE="linuxkit-kernel-wifi" push_$KERNEL_SERIES$EXTRA

